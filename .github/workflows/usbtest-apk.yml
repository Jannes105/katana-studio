name: USB test APK

on:
  push:
    paths:
      - 'usbtest/**'
      - 'testpages/**'
      - '.github/workflows/usbtest-apk.yml'
  pull_request:
    paths:
      - 'usbtest/**'
      - 'testpages/**'
      - '.github/workflows/usbtest-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usbtest/package-lock.json

      # Capacitor 8 compiles with Java 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Test the shared page code
        working-directory: testpages
        run: node --test

      - name: Install dependencies
        working-directory: usbtest
        run: npm ci

      - name: Copy the test pages into www
        working-directory: usbtest
        run: node scripts/copy-web.mjs

      - name: Sync Capacitor
        working-directory: usbtest
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: usbtest/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v5
        with:
          name: katana-usb-test-apk
          path: usbtest/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
