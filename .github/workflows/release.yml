name: Release

# Signed APK (PLAN 6). A tag vX.Y.Z on main builds, signs and publishes a GitHub Release with the APK; the tag must
# match the version in package.json. Started by hand ("Run workflow") it builds the same signed APK as an artifact
# only, without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # creating the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read the version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - name: Type check, lint, tests, build
        run: npm run verify

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Build the signed release APK
        working-directory: android
        env:
          KATANA_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KATANA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KATANA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KATANA_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"

      - name: Check the signature and name the APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          # The exit code of apksigner is the check. Its output format differs between build-tools versions
          # ("Signer #1 …" or "Signer (minSdkVersion=…) …"), so it is only shown, never parsed. Only the
          # certificate digest goes into the public log, not the DN.
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "Signature verified with $(basename "$tools")/apksigner"
          echo "$certs" | grep -E "certificate SHA-256 digest" || true
          out="katana-studio-$VERSION.apk"
          cp "$apk" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: katana-studio-signed-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FILE: ${{ steps.apk.outputs.file }}
          RUN: ${{ github.run_number }}
        run: |
          # --generate-notes appends the pull requests merged since the previous tag to the text below.
          gh release create "$TAG" "$FILE" \
            --title "Katana Studio $TAG" \
            --generate-notes \
            --notes "Signed APK (versionCode $RUN). Install it on the phone by hand. Unofficial hobby project, not affiliated with BOSS/Roland."
