<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katana Remote Test</title>
<style>
  :root { --bg:#121417; --card:#1c1f24; --fg:#e8e8e8; --mut:#8a9099; --acc:#f39c12; --ok:#2ecc71; --err:#e74c3c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.45 system-ui, sans-serif; padding:16px; max-width:720px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.sub { color:var(--mut); margin:0 0 16px; font-size:13px; }
  section { background:var(--card); border-radius:10px; padding:14px; margin-bottom:12px; }
  h2 { font-size:15px; margin:0 0 10px; color:var(--acc); display:flex; justify-content:space-between; align-items:center; }
  button { background:var(--acc); color:#111; border:0; border-radius:8px; padding:10px 14px; font-weight:600; font-size:15px; margin:4px 4px 4px 0; }
  button.sec { background:#2c313a; color:var(--fg); }
  button:disabled { opacity:.4; }
  #status { font-weight:600; margin-top:6px; }
  #patch { font:600 22px ui-monospace, monospace; letter-spacing:1px; margin:4px 0; }
  .ok { color:var(--ok); } .err { color:var(--err); } .info { color:var(--mut); }
  .ctl { margin:10px 0 4px; }
  .ctl label { display:flex; justify-content:space-between; font-size:14px; }
  .ctl output { font:600 15px ui-monospace, monospace; color:var(--acc); }
  input[type=range] { width:100%; height:32px; accent-color:var(--acc); }
  .switch { display:flex; align-items:center; gap:10px; font-size:14px; }
  .switch input { width:24px; height:24px; accent-color:var(--acc); }
  .disabled { opacity:.4; pointer-events:none; }
  details { margin-top:8px; }
  summary { color:var(--mut); font-size:13px; cursor:pointer; }
  input.hex { background:#0e1013; color:var(--fg); border:1px solid #333a44; border-radius:6px; padding:8px; font:14px ui-monospace, monospace; width:100%; margin:4px 0 8px; }
  #log { background:#0b0c0e; border-radius:8px; padding:10px; height:220px; overflow:auto; font:12px/1.5 ui-monospace, monospace; white-space:pre-wrap; word-break:break-all; margin-top:8px; }
  .in { color:#7fd3ff; } .out { color:#ffd27f; }
</style>
</head>
<body>
<h1>Katana Remote Test</h1>
<p class="sub">Katana Gen 3 per USB-Kabel steuern. Änderungen wirken sofort, werden aber erst dauerhaft, wenn du den Patch am Amp speicherst.</p>

<section>
  <h2>Verbindung</h2>
  <button id="btnConnect">Verbinden</button>
  <div id="status" class="info">Nicht verbunden.</div>
  <div id="patch"></div>
</section>

<section id="secNs" class="disabled">
  <h2>Noise Suppressor <button class="sec" id="btnReload">Neu lesen</button></h2>
  <div class="switch"><input type="checkbox" id="nsSw"><label for="nsSw">An</label></div>
  <div class="ctl"><label>Threshold <output id="nsThrV">–</output></label><input type="range" id="nsThr" min="0" max="100"></div>
  <div class="ctl"><label>Release <output id="nsRelV">–</output></label><input type="range" id="nsRel" min="0" max="100"></div>
</section>

<section id="secAmp" class="disabled">
  <h2>Amp</h2>
  <div class="ctl"><label>Gain <output id="gainV">–</output></label><input type="range" id="gain" min="0" max="100"></div>
  <div class="ctl"><label>Volume <output id="volV">–</output></label><input type="range" id="vol" min="0" max="100"></div>
</section>

<section>
  <h2>Log <span><button class="sec" id="btnCopy">Kopieren</button><button class="sec" id="btnClear">Leeren</button></span></h2>
  <details>
    <summary>Eigene Leseanfrage (für Experimente)</summary>
    <input class="hex" id="addr" value="20 00 58 00" aria-label="Adresse">
    <input class="hex" id="size" value="00 00 00 03" aria-label="Länge">
    <button class="sec" id="btnRead">Lesen</button>
  </details>
  <div id="log"></div>
</section>

<script>
// ---- Protokoll (aus BOSS TONE STUDIO for KATANA Gen 3) ----
const MODEL = [0x01, 0x05, 0x07];
let DEV = 0x10;
const ADDR = {
  editorLevel: [0x7F, 0x00, 0x00, 0x00],
  editorMode:  [0x7F, 0x00, 0x00, 0x01],
  patchName:   [0x20, 0x00, 0x00, 0x00],  // 16 Zeichen
  amp:         [0x20, 0x00, 0x06, 0x00],  // +0 Gain, +1 Volume
  ns:          [0x20, 0x00, 0x58, 0x00],  // +0 Schalter, +1 Threshold, +2 Release
};

const $ = id => document.getElementById(id);
let midi = null, input = null, output = null;
const pending = new Map(); // key: Adresse als String -> resolve

const hex = arr => Array.from(arr, b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
const parseHex = s => s.trim().split(/[\s,]+/).filter(Boolean).map(x => parseInt(x, 16));
const addOfs = (a, o) => [a[0], a[1], a[2], a[3] + o];
const key = a => hex(a);

function log(msg, cls = 'info') {
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  $('log').appendChild(line);
  $('log').scrollTop = $('log').scrollHeight;
}
function setStatus(t, c) { $('status').textContent = t; $('status').className = c; }

const checksum = bytes => (128 - (bytes.reduce((a, b) => a + b, 0) % 128)) % 128;
function roland(cmd, addr, body) {
  const p = [...addr, ...body];
  return [0xF0, 0x41, DEV, ...MODEL, cmd, ...p, checksum(p), 0xF7];
}
function send(bytes, note) {
  output.send(bytes);
  log(`→ ${hex(bytes)}${note ? '  (' + note + ')' : ''}`, 'out');
}
const dt1 = (addr, data, note) => send(roland(0x12, addr, data), note);

function rq1(addr, size, note, timeout = 1500) {
  return new Promise((resolve, reject) => {
    pending.set(key(addr), resolve);
    send(roland(0x11, addr, [0, 0, 0, size]), note);
    setTimeout(() => { if (pending.delete(key(addr))) reject(new Error('Keine Antwort auf ' + key(addr))); }, timeout);
  });
}

let identityResolve = null;
function onMessage(e) {
  const d = Array.from(e.data);
  if (d[0] === 0xFE || d[0] === 0xF8) return;
  log(`← ${hex(d)}`, 'in');
  if (d[0] === 0xF0 && d[1] === 0x7E && d[3] === 0x06 && d[4] === 0x02) {
    DEV = d[2];
    if (identityResolve) { identityResolve(d); identityResolve = null; }
    return;
  }
  const h = 3 + MODEL.length; // Position des Befehls
  if (d[0] === 0xF0 && d[1] === 0x41 && d[h] === 0x12 && MODEL.every((m, i) => d[3 + i] === m)) {
    const addr = d.slice(h + 1, h + 5), data = d.slice(h + 5, d.length - 2);
    const r = pending.get(key(addr));
    if (r) { pending.delete(key(addr)); r(data); }
    else applyIncoming(addr, data); // Amp meldet Änderung von sich aus
  }
}

// Vom Amp gemeldete Änderungen (z. B. Kanalwechsel, Regler am Amp) übernehmen
function applyIncoming(addr, data) {
  const a = key(addr.slice(0, 3));
  if (a === key(ADDR.ns.slice(0, 3)) && addr[3] <= 2) {
    const vals = [null, null, null];
    data.forEach((v, i) => { if (addr[3] + i <= 2) vals[addr[3] + i] = v; });
    showNs(vals);
  } else if (a === key(ADDR.amp.slice(0, 3)) && addr[3] <= 1) {
    data.forEach((v, i) => showAmp(addr[3] + i, v));
  } else if (addr[0] === 0x00 || (addr[0] === 0x7F)) {
    // Patchwechsel o. Ä. -> alles neu lesen
    setTimeout(readAll, 150);
  }
}

function showNs([sw, thr, rel]) {
  if (sw !== null) $('nsSw').checked = !!sw;
  if (thr !== null) { $('nsThr').value = thr; $('nsThrV').textContent = thr; }
  if (rel !== null) { $('nsRel').value = rel; $('nsRelV').textContent = rel; }
}
function showAmp(i, v) {
  const [s, o] = i === 0 ? ['gain', 'gainV'] : ['vol', 'volV'];
  $(s).value = v; $(o).textContent = v;
}

async function readAll() {
  try {
    const name = await rq1(ADDR.patchName, 16, 'Patch-Name');
    $('patch').textContent = String.fromCharCode(...name).trim() || '(ohne Name)';
    showNs(await rq1(ADDR.ns, 3, 'Noise Suppressor'));
    const amp = await rq1(ADDR.amp, 2, 'Gain/Volume');
    showAmp(0, amp[0]); showAmp(1, amp[1]);
    $('secNs').classList.remove('disabled'); $('secAmp').classList.remove('disabled');
  } catch (e) { log(e.message, 'err'); }
}

async function connect() {
  if (!navigator.requestMIDIAccess) return setStatus('Dieser Browser kann kein Web MIDI. Bitte Chrome verwenden.', 'err');
  if (!window.isSecureContext) return setStatus('Seite braucht https oder localhost.', 'err');
  try {
    midi = await navigator.requestMIDIAccess({ sysex: true });
  } catch (e) { return setStatus('MIDI-Zugriff verweigert: ' + e.message, 'err'); }
  input = [...midi.inputs.values()].find(p => /katana/i.test(p.name));
  output = [...midi.outputs.values()].find(p => /katana/i.test(p.name));
  if (!input || !output) return setStatus('Katana nicht gefunden. USB angeschlossen, Amp an, Boss Tone Studio geschlossen?', 'err');
  input.onmidimessage = onMessage;
  setStatus('Begrüße Amp …', 'info');
  try {
    // 1. Identität
    const id = new Promise((res, rej) => { identityResolve = res; setTimeout(() => rej(new Error('Keine Identitätsantwort')), 1500); });
    send([0xF0, 0x7E, 0x7F, 0x06, 0x01, 0xF7], 'Identitätsabfrage');
    await id;
    // 2. Editor-Kommunikation wie BTS
    await rq1(ADDR.editorLevel, 1, 'Editor-Level');
    dt1(ADDR.editorMode, [0x01], 'Editor-Modus an');
    await new Promise(r => setTimeout(r, 100));
    setStatus(`Verbunden mit ${input.name}`, 'ok');
    $('btnConnect').textContent = 'Neu verbinden';
    await readAll();
  } catch (e) { setStatus(e.message, 'err'); log(e.message, 'err'); }
}

// Regler -> Amp (gedrosselt, damit beim Ziehen nicht zu viele Nachrichten rausgehen)
function bindSlider(id, outId, addr) {
  let t = null;
  $(id).addEventListener('input', () => {
    $(outId).textContent = $(id).value;
    clearTimeout(t);
    t = setTimeout(() => dt1(addr, [+$(id).value], id), 40);
  });
}
bindSlider('nsThr', 'nsThrV', addOfs(ADDR.ns, 1));
bindSlider('nsRel', 'nsRelV', addOfs(ADDR.ns, 2));
bindSlider('gain', 'gainV', addOfs(ADDR.amp, 0));
bindSlider('vol', 'volV', addOfs(ADDR.amp, 1));
$('nsSw').addEventListener('change', () => dt1(ADDR.ns, [$('nsSw').checked ? 1 : 0], 'NS an/aus'));

$('btnConnect').onclick = connect;
$('btnReload').onclick = readAll;
$('btnRead').onclick = async () => {
  const a = parseHex($('addr').value), s = parseHex($('size').value);
  if (a.length !== 4 || s.length !== 4) return log('Adresse und Länge brauchen je 4 Bytes.', 'err');
  try { const d = await rq1(a, s[3], 'eigene Anfrage'); log('   Daten: ' + hex(d) + '  = dezimal ' + d.join(', '), 'in'); }
  catch (e) { log(e.message, 'err'); }
};
$('btnClear').onclick = () => $('log').innerHTML = '';
$('btnCopy').onclick = async () => {
  try { await navigator.clipboard.writeText($('log').innerText); log('Log kopiert.'); }
  catch { log('Kopieren nicht möglich.', 'err'); }
};
window.addEventListener('beforeunload', () => { try { if (output) dt1(ADDR.editorMode, [0x00], 'Editor-Modus aus'); } catch {} });
</script>
</body>
</html>
